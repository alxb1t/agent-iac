---
box_user: box
box_home: "/home/{{ box_user }}"
box_config: "{{ box_home }}/.config/agent-iac"
box_restic_env: "{{ box_config }}/{{ box.name }}.restic.env"
box_tailscale_key: /run/box-tailscale-auth-key
box_packages:
  - podman
  - crun
  - rsync
  - restic
  - nftables
  - unattended-upgrades
  - tailscale
box_subid_start: 100000
box_subid_count: 65536
