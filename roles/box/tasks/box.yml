---
# The box side: env file, volume, blueprint, image, the quadlet and the KB. Guards: 0002-the-box design D10.
# Shared with restore and the drill.
- name: Set the box user's bus
  ansible.builtin.import_tasks: user_env.yml

- name: Create the box user's config directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ box_user }}"
    group: "{{ box_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ box_home }}/.config", mode: "0755" }
    - { path: "{{ box_home }}/.config/containers", mode: "0755" }
    - { path: "{{ box_home }}/.config/containers/systemd", mode: "0755" }
    - { path: "{{ box_config }}", mode: "0700" }
    - { path: "{{ box_config }}/{{ box.name }}", mode: "0700" }
    - { path: "{{ box_config }}/{{ box.name }}/blueprint", mode: "0700" }

- name: Write the agent's env file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ box_config }}/{{ box.name }}.env"
    owner: "{{ box_user }}"
    group: "{{ box_user }}"
    mode: "0600"
  no_log: true
  notify: Restart the box

# The deployment's blueprint first: filetree gives the first path precedence.
- name: Stage the blueprint
  vars:
    box_blueprint: >-
      {{ query('community.general.filetree', box_dir ~ '/blueprint', role_path ~ '/../../blueprints/base') }}
  block:
    - name: Stage the blueprint directories
      ansible.builtin.file:
        path: "{{ box_config }}/{{ box.name }}/blueprint/{{ item.path }}"
        state: directory
        owner: "{{ box_user }}"
        group: "{{ box_user }}"
        mode: "0700"
      loop: "{{ box_blueprint | selectattr('state', 'eq', 'directory') }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Stage the blueprint files
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ box_config }}/{{ box.name }}/blueprint/{{ item.path }}"
        owner: "{{ box_user }}"
        group: "{{ box_user }}"
        mode: "0600"
      loop: "{{ box_blueprint | selectattr('state', 'eq', 'file') }}"
      loop_control:
        label: "{{ item.path }}"

- name: Install the blueprint sync script
  ansible.builtin.template:
    src: box-blueprint-sync.sh.j2
    dest: /usr/local/bin/box-blueprint-sync
    owner: root
    group: root
    mode: "0755"

# The key reaches the agent as a mounted Podman secret, kept off the volume and the env file.
# Why: 0003-the-knowledge-base design D4.
- name: Keep the KB deploy key as a Podman secret
  when: box.kb is defined
  become: true
  become_user: "{{ box_user }}"
  environment: "{{ box_user_env }}"
  vars:
    box_kb_key: "{{ (box_secrets.KB_DEPLOY_KEY | trim) ~ '\n' }}"
    box_kb_key_sha256: "{{ box_kb_key | hash('sha256') }}"
    box_kb_secret_name: "{{ box.name }}-kb-deploy-key"
  block:
    # Inspect shows no value, so a label holding the key's hash is the idempotence guard.
    - name: Read the deploy key's hash
      ansible.builtin.command:
        argv:
          - podman
          - secret
          - inspect
          - --format
          - "{% raw %}{{ .Spec.Labels.sha256 }}{% endraw %}"
          - "{{ box_kb_secret_name }}"
      register: box_kb_secret
      changed_when: false
      failed_when: false

    - name: Store the deploy key
      ansible.builtin.command:
        cmd: >-
          podman secret create --replace --label sha256={{ box_kb_key_sha256 }} {{ box_kb_secret_name }} -
        stdin: "{{ box_kb_key }}"
        stdin_add_newline: false
      when: box_kb_secret.stdout | trim != box_kb_key_sha256
      changed_when: true
      no_log: true
      notify: Restart the box

- name: Write the quadlet
  ansible.builtin.template:
    src: box.container.j2
    dest: "{{ box_home }}/.config/containers/systemd/{{ box.name }}.container"
    owner: "{{ box_user }}"
    group: "{{ box_user }}"
    mode: "0644"
  notify: Restart the box

- name: Run as the box user, on its bus
  become: true
  become_user: "{{ box_user }}"
  environment: "{{ box_user_env }}"
  block:
    - name: Look for the volume
      ansible.builtin.command: podman volume inspect {{ box.name }}-data
      register: box_volume
      changed_when: false
      failed_when: false

    - name: Create the volume
      ansible.builtin.command: podman volume create {{ box.name }}-data
      when: box_volume.rc != 0
      changed_when: true

    - name: Look for the image
      ansible.builtin.command: podman image exists {{ manifest.image }}:{{ box.version }}
      register: box_image
      changed_when: false
      failed_when: false

    # Pulled apart from the start, so a missing image fails here, not in the restart loop.
    - name: Pull the image
      ansible.builtin.command: podman pull {{ manifest.image }}:{{ box.version }}
      when: box_image.rc != 0
      changed_when: true

    - name: Copy the blueprint into the volume
      ansible.builtin.command: /usr/local/bin/box-blueprint-sync
      register: box_sync
      changed_when: box_sync.stdout | length > 0
      notify: Restart the box

    # A quadlet unit is generated, so `enable` refuses it; its [Install] section starts it at boot.
    # daemon-reload generates it on every apply, so one that failed after writing the quadlet still
    # converges; the reload alone does not mark the task changed.
    - name: Start the service
      ansible.builtin.systemd_service:
        name: "{{ box.name }}"
        state: started
        scope: user
        daemon_reload: true
      register: box_start

    # A running box restarts only in the handler: run it now, so the clone runs in the container the new
    # quadlet starts, with the key and the pinned host keys, and a failed clone cannot drop the restart.
    - name: Restart the box before the clone
      ansible.builtin.meta: flush_handlers

# Shared with restore: 0004-the-handover design D9.
- name: Import the KB clone
  ansible.builtin.import_tasks: kb.yml
