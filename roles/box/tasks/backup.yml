---
# The restic repository, the SFTP key and the nightly script. Why: 0002-the-box design D11 and D12.
- name: Write the restic env file
  ansible.builtin.template:
    src: restic.env.j2
    dest: "{{ box_restic_env }}"
    owner: "{{ box_user }}"
    group: "{{ box_user }}"
    mode: "0600"
  no_log: true

- name: Create the box user's ssh directory
  ansible.builtin.file:
    path: "{{ box_home }}/.ssh"
    state: directory
    owner: "{{ box_user }}"
    group: "{{ box_user }}"
    mode: "0700"

- name: Generate the box user's SFTP key
  ansible.builtin.command:
    argv: [ssh-keygen, -q, -t, ed25519, -N, "", -C, "{{ box.name }}-backup", -f, "{{ box_home }}/.ssh/id_ed25519"]
    creates: "{{ box_home }}/.ssh/id_ed25519"
  become: true
  become_user: "{{ box_user }}"

# Trust the backup host's key on first use: nobody answers a prompt at 04:00.
- name: Accept a new backup host key on first use
  ansible.builtin.copy:
    content: "StrictHostKeyChecking accept-new\n"
    dest: "{{ box_home }}/.ssh/config"
    owner: "{{ box_user }}"
    group: "{{ box_user }}"
    mode: "0600"

- name: Read the restic repository
  ansible.builtin.shell: |
    set -a; . {{ box_restic_env }}; set +a
    restic snapshots --latest 1 --quiet
  become: true
  become_user: "{{ box_user }}"
  register: box_restic
  changed_when: false
  failed_when: false

- name: Initialise the restic repository
  ansible.builtin.shell: |
    set -a; . {{ box_restic_env }}; set +a
    restic init
  become: true
  become_user: "{{ box_user }}"
  when: box_restic.rc != 0
  register: box_restic_init
  changed_when: box_restic_init.rc == 0
  failed_when: false

- name: Stop when the backup host refuses the box
  when: box_restic_init is not skipped and box_restic_init.rc != 0
  block:
    - name: Read the SFTP public key
      ansible.builtin.slurp:
        src: "{{ box_home }}/.ssh/id_ed25519.pub"
      register: box_sftp_key

    - name: Name the key to authorise
      ansible.builtin.fail:
        msg: >-
          restic init failed: {{ box_restic_init.stderr }}.
          Authorise this key on the backup host, then apply again:
          {{ box_sftp_key.content | b64decode | trim }}

- name: Install the backup script
  ansible.builtin.template:
    src: box-backup.sh.j2
    dest: /usr/local/bin/box-backup
    owner: root
    group: root
    mode: "0755"
