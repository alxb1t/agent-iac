---
# The rclone remote, the recipients and the nightly script. Why: 0004-the-handover design D4 and D5.
- name: Write the rclone env file
  ansible.builtin.template:
    src: rclone.env.j2
    dest: "{{ box_rclone_env }}"
    owner: "{{ box_user }}"
    group: "{{ box_user }}"
    mode: "0600"
  no_log: true

- name: Write the backup recipients
  ansible.builtin.copy:
    content: "{{ box_recipients | join('\n') }}\n"
    dest: "{{ box_recipients_file }}"
    owner: "{{ box_user }}"
    group: "{{ box_user }}"
    mode: "0644"

# It holds the password of a backup no box uses any more.
- name: Remove the restic env file
  ansible.builtin.file:
    path: "{{ box_config }}/{{ box.name }}.restic.env"
    state: absent

# v0.3's backup host may still accept that key, and the box never reaches back.
- name: Remove the SFTP key and ssh config of the old backup
  ansible.builtin.file:
    path: "{{ box_home }}/.ssh/{{ item }}"
    state: absent
  loop: [id_ed25519, id_ed25519.pub, config, known_hosts]

- name: Install the backup script
  ansible.builtin.template:
    src: box-backup.sh.j2
    dest: /usr/local/bin/box-backup
    owner: root
    group: root
    mode: "0755"
