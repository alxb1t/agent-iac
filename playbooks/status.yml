---
- name: Load the box
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Read box.yaml, its runtime and its secrets
      alxb1t.agent_iac.box_load:
        box_file: "{{ box_file }}"

- name: Show the box
  hosts: box
  gather_facts: false
  vars_files:
    - ../roles/box/defaults/main.yml
  vars:
    box_as_user: >-
      export XDG_RUNTIME_DIR=/run/user/$(id -u);
      set -a; . {{ box_rclone_env }}; set +a;
  tasks:
    - name: Read the container
      ansible.builtin.command:
        argv:
          - su
          - "-"
          - "{{ box_user }}"
          - -c
          - >-
            {{ box_as_user }} podman ps --filter name=^{{ box.name }}$
            --format '{% raw %}{{ .State }} {{ .Image }}{% endraw %}'
      register: box_ps
      changed_when: false

    - name: List the archives
      ansible.builtin.command:
        argv:
          - su
          - "-"
          - "{{ box_user }}"
          - -c
          - "{{ box_as_user }} rclone lsf --files-only --include '{{ box_archives_glob }}' r2:{{ box_r2_bucket }}"
      register: box_archives
      changed_when: false

    # The names sort by time, so the last is the newest.
    - name: Print the status
      vars:
        box_container: "{{ (box_ps.stdout_lines | first | default('absent -')).split(' ') }}"
      ansible.builtin.debug:
        msg:
          - "container: {{ box_container[0] }}"
          - "image: {{ box_container[1] }}"
          - "archive: {{ box_archives.stdout_lines | sort | last | default('none') }}"
