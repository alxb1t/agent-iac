---
- name: Load the box
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Read box.yaml, its runtime and its secrets
      alxb1t.agent_iac.box_load:
        box_file: "{{ box_file }}"

- name: Show the box
  hosts: box
  gather_facts: false
  vars_files:
    - ../roles/box/defaults/main.yml
  vars:
    box_as_user: >-
      export XDG_RUNTIME_DIR=/run/user/$(id -u);
      set -a; . {{ box_restic_env }}; set +a;
  tasks:
    - name: Read the container
      ansible.builtin.command:
        argv:
          - su
          - "-"
          - "{{ box_user }}"
          - -c
          - >-
            {{ box_as_user }} podman ps --filter name=^{{ box.name }}$
            --format '{% raw %}{{ .State }} {{ .Image }}{% endraw %}'
      register: box_ps
      changed_when: false

    - name: Read the latest snapshot
      ansible.builtin.command:
        argv: [su, "-", "{{ box_user }}", -c, "{{ box_as_user }} restic snapshots --latest 1 --json"]
      register: box_snapshots
      changed_when: false
      failed_when: false

    - name: Read the SFTP public key
      ansible.builtin.slurp:
        src: "{{ box_home }}/.ssh/id_ed25519.pub"
      register: box_sftp_key

    # With no snapshot yet, the third line names the key the backup host must authorise.
    - name: Print the status
      vars:
        box_container: "{{ (box_ps.stdout_lines | first | default('absent -')).split(' ') }}"
        box_latest: >-
          {{ box_snapshots.stdout | default('[]', true) | from_json | default([], true) | sort(attribute='time') }}
      ansible.builtin.debug:
        msg:
          - "container: {{ box_container[0] }}"
          - "image: {{ box_container[1] }}"
          - >-
            {{ 'snapshot: ' ~ box_latest[-1].time if box_latest
               else 'snapshot: none; authorise on the backup host: ' ~ (box_sftp_key.content | b64decode | trim) }}
