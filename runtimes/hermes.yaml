---
# runtimes/hermes.yaml — env names re-checked against the pinned image's docs at every version bump
image: docker.io/nousresearch/hermes-agent
state:
  - /opt/data
env:
  - TELEGRAM_BOT_TOKEN
  - TELEGRAM_ALLOWED_USERS
  - OPENROUTER_API_KEY
  - HERMES_DASHBOARD_BASIC_AUTH_USERNAME
  - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH
  - HERMES_DASHBOARD_BASIC_AUTH_SECRET
blueprint_mount: /opt/data
environment:
  HERMES_DASHBOARD: "1"
  WIKI_PATH: /opt/data/kb
  OBSIDIAN_VAULT_PATH: /opt/data/kb
  GIT_HOOK_ROOTS: /opt/data/kb
ports:
  - 9119
# Each runs in the image as the agent's user; the placeholder is the zip's path in the container.
backup: [hermes, backup, -o, "{archive}"]
restore: [hermes, import, --force, "{archive}"]
